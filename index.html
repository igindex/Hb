<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburguelândia CDE - Web App Delivery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#e50914;--primary-yellow:#ffb703;--bg-main:#0d0d0d;--card-bg:#181818;--card-border:#282828;--text-primary:#fff;--text-secondary:#a0a0a0;--accent-green:#25d366;--border-radius:16px}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:var(--bg-main);color:var(--text-primary);padding-bottom:110px}
        .hero-header{position:relative;background:linear-gradient(to bottom,rgba(0,0,0,.3),var(--bg-main)),url('https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;padding:40px 20px 20px;text-align:center;border-bottom:1px solid var(--card-border)}
        .logo-ring{width:100px;height:100px;margin:0 auto 12px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 20px rgba(229,9,20,.6);display:flex;align-items:center;justify-content:center}
        .logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
        .restaurant-title{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
        .restaurant-slogan{font-size:13px;color:var(--primary-yellow);font-weight:500;margin-top:2px}
        .social-bar{display:flex;justify-content:center;gap:12px;margin-top:15px}
        .social-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px;transition:.2s;backdrop-filter:blur(5px)}
        .social-icon:hover{transform:translateY(-2px);background:var(--primary)}
        .search-container{padding:15px 20px;position:sticky;top:0;z-index:90;background:rgba(13,13,13,.95);backdrop-filter:blur(10px)}
        .search-box{background:#222;border-radius:12px;padding:10px 15px;display:flex;align-items:center;gap:10px;border:1px solid #333}
        .search-box input{background:transparent;border:none;color:#fff;width:100%;font-size:14px;outline:none}
        .categories-scroll{display:flex;gap:10px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
        .categories-scroll::-webkit-scrollbar{display:none}
        .cat-chip{padding:8px 16px;background:#222;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text-secondary);border:1px solid #333;cursor:pointer;transition:.2s}
        .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .app-container{max-width:500px;margin:0 auto;padding:0 15px}
        .section-header{font-size:18px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:8px;color:var(--primary-yellow)}
        .item-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--border-radius);padding:14px;margin-bottom:14px;display:flex;gap:12px;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2)}
        .item-img{width:95px;height:95px;border-radius:12px;object-fit:cover;flex-shrink:0}
        .item-details{flex:1;display:flex;flex-direction:column;justify-content:space-between}
        .item-name{font-size:15px;font-weight:700;line-height:1.2;margin-bottom:4px}
        .item-desc{font-size:11px;color:var(--text-secondary);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
        .item-bottom{display:flex;justify-content:space-between;align-items:center}
        .item-price{font-weight:700;font-size:15px;color:var(--primary-yellow)}
        .add-btn{background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;transition:.15s}
        .add-btn:active{transform:scale(.92)}
        .cart-float-bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:calc(100% - 30px);max-width:470px;background:var(--primary);color:#fff;padding:14px 20px;border-radius:30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 25px rgba(229,9,20,.5);z-index:1000;cursor:pointer}
        .cart-info{display:flex;align-items:center;gap:10px}
        .cart-count-badge{background:#fff;color:var(--primary);font-weight:800;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);z-index:2000;display:none;justify-content:center;align-items:flex-end}
        .modal-sheet{background:#181818;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow-y:auto;position:relative;animation:slideUp .3s ease-out}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .sheet-close{position:absolute;top:15px;right:15px;background:#282828;border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
        .option-title{font-size:13px;font-weight:700;color:var(--primary-yellow);margin:15px 0 8px;text-transform:uppercase}
        .radio-option{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#222;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
        .radio-option input{accent-color:var(--primary)}
        .form-input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-size:13px;margin-bottom:10px;outline:none}
        .form-input:focus{border-color:var(--primary)}
        .cart-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #282828}
        .qty-btn{background:#282828;color:#fff;border:none;width:28px;height:28px;border-radius:6px;font-weight:bold;cursor:pointer}
        .btn-green{width:100%;background:var(--accent-green);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:15px}
        .btn-green:disabled{opacity:.5;cursor:not-allowed}
        .fullview{position:fixed;inset:0;background:var(--bg-main);z-index:1500;display:none;overflow-y:auto}
        .fv-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;border-bottom:1px solid var(--card-border);z-index:2;font-size:16px}
        .fv-body{max-width:500px;margin:0 auto;padding:16px}
        .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
        @media(max-width:800px){.pgrid{grid-template-columns:1fr}}
        .pcol{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:10px;align-self:start}
        .pcol-h{color:#fff;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
        .pempty{color:#888;font-size:13px;padding:6px}
        .ocard{background:#222;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px}
        .ohead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
        .ohead span{margin-left:auto;color:#a0a0a0;font-size:12px}
        .oitems{line-height:1.5}
        .ometa{color:#a0a0a0;font-size:12px;margin-top:6px}
        .ototal{color:var(--primary-yellow);font-weight:800;margin:8px 0}
        .oact{display:flex;gap:8px}
        .obtn{flex:1;background:var(--primary);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
        .obtn.alt{flex:0 0 auto;background:#333;padding:10px 14px}
        .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .mesa{background:#222;border:2px solid #333;border-radius:14px;color:#fff;padding:16px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
        .mesa b{font-size:22px}
        .mesa small{color:#a0a0a0}
        .mesa.busy{border-color:var(--primary);background:#2a1214}
        .mozo-menu{max-height:220px;overflow-y:auto;border:1px solid #282828;border-radius:10px;padding:0 10px;margin-bottom:10px}
        .track-chip{position:fixed;right:15px;bottom:84px;z-index:1000;background:#fff;color:#111;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;display:none}
        .tstep{display:flex;align-items:center;gap:12px;padding:12px 0;color:#777}
        .tstep i{width:26px;height:26px;border-radius:50%;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal;flex-shrink:0}
        .tstep.done{color:#fff}
        .tstep.done i{background:var(--accent-green);border-color:var(--accent-green)}
    </style>
</head>
<body>
<header class="hero-header">
    <div class="logo-ring"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=200&q=80" alt="Hamburguelândia Logo"></div>
    <h1 class="restaurant-title">Hamburguelândia CDE</h1>
    <p class="restaurant-slogan">Sabores que te hacen sonreír 🍔✨</p>
    <div class="social-bar">
        <a href="https://wa.me/5950982194749" class="social-icon" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://instagram.com/hamburguelandia_cde" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://maps.google.com" class="social-icon" target="_blank"><i class="fas fa-location-dot"></i></a>
        <a href="https://tiktok.com" class="social-icon" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://facebook.com" class="social-icon" target="_blank"><i class="fab fa-facebook-f"></i></a>
    </div>
</header>

<div class="search-container">
    <div class="search-box"><i class="fas fa-search" style="color:#666"></i><input type="text" id="searchInput" placeholder="Buscar hamburguesa, combos, bebidas..." oninput="filterMenu()"></div>
</div>

<div class="categories-scroll">
    <div class="cat-chip active" onclick="filterCategory('all',this)">🔥 Todos</div>
    <div class="cat-chip" onclick="filterCategory('artesanales',this)">🍔 Artesanales</div>
    <div class="cat-chip" onclick="filterCategory('combos',this)">🍟 Combos</div>
    <div class="cat-chip" onclick="filterCategory('bebidas',this)">🥤 Bebidas</div>
    <div class="cat-chip" onclick="filterCategory('postres',this)">🍦 Postres</div>
</div>

<div class="app-container"><div id="menuContent"></div></div>

<div class="cart-float-bar" onclick="openCartModal()">
    <div class="cart-info"><div class="cart-count-badge" id="cartBadge">0</div><span style="font-weight:700">Ver Pedido</span></div>
    <span id="cartTotalFloat" style="font-weight:800;font-size:16px">0 Gs</span>
</div>

<div class="modal-overlay" id="itemModal">
    <div class="modal-sheet">
        <button class="sheet-close" onclick="closeItemModal()">&times;</button>
        <h3 id="modalItemTitle" style="font-size:18px;margin-bottom:4px"></h3>
        <p id="modalItemDesc" style="font-size:12px;color:var(--text-secondary);margin-bottom:12px"></p>
        <div class="option-title">1. Elige el Tamaño</div><div id="modalSizeOptions"></div>
        <div class="option-title">2. Extras opcionales</div><div id="modalExtrasOptions"></div>
        <button class="btn-green" style="background:var(--primary);margin-top:20px" onclick="confirmAddToCart()"><i class="fas fa-cart-plus"></i> Agregar al Pedido</button>
    </div>
</div>

<div class="modal-overlay" id="cartModal">
    <div class="modal-sheet">
        <button class="sheet-close" onclick="closeCartModal()">&times;</button>
        <h3 style="font-size:18px;margin-bottom:15px"><i class="fas fa-shopping-bag" style="color:var(--primary)"></i> Mi Pedido</h3>
        <div id="cartItemsList"></div>
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:15px 0;border-top:1px dashed #333;padding-top:10px"><span>Total:</span><span id="cartTotalModal" style="color:var(--primary-yellow)">0 Gs</span></div>
        <div class="option-title">Datos para la entrega</div>
        <input type="text" id="custName" class="form-input" placeholder="Tu Nombre completo *">
        <input type="text" id="custAddress" class="form-input" placeholder="Dirección de entrega o Barrio *">
        <div class="option-title">Forma de Pago</div>
        <select id="custPayment" class="form-input" onchange="toggleChangeBox()">
            <option value="Efectivo">Efectivo</option><option value="Transferencia Bancaria">Transferencia Bancaria</option><option value="POS / Tarjeta">POS / Tarjeta</option><option value="PIX">PIX</option>
        </select>
        <input type="text" id="custChange" class="form-input" placeholder="¿Cambio de cuánto necesitas? (Ej: 100.000 Gs)">
        <input type="text" id="custNotes" class="form-input" placeholder="Observaciones (Ej: Sin cebolla, pan bien tostado)">
        <button class="btn-green" onclick="sendWhatsAppOrder()"><i class="fab fa-whatsapp" style="font-size:20px"></i> Enviar Pedido al WhatsApp</button>
    </div>
</div>

<div class="track-chip" id="trackChip" onclick="openTrack()"></div>

<div class="modal-overlay" id="trackModal">
    <div class="modal-sheet">
        <button class="sheet-close" onclick="closeTrack()">&times;</button>
        <h3 style="font-size:18px;margin-bottom:10px"><i class="fas fa-motorcycle" style="color:var(--primary)"></i> Seguimiento de tu pedido</h3>
        <div id="trackBody"></div>
    </div>
</div>

<div class="fullview" id="panelView">
    <div class="fv-top"><b><i class="fas fa-fire" style="color:var(--primary)"></i> Panel de pedidos</b><button class="obtn alt" onclick="location.hash=''">Salir</button></div>
    <div class="pgrid" id="panelBody"></div>
</div>

<div class="fullview" id="mozoView">
    <div class="fv-top"><b><i class="fas fa-utensils" style="color:var(--primary)"></i> Mozo</b><button class="obtn alt" onclick="location.hash=''">Salir</button></div>
    <div class="fv-body" id="mozoBody"></div>
</div>

<script>
const menuData=[
{category:'artesanales',catName:'🍔 Hamburguesas Artesanales',items:[
{id:'h1',name:'Hamburguelândia Supreme',desc:'Doble carne artesanal 160g, queso cheddar derretido, bacon crocante, cebolla caramelizada y salsa especial.',priceSimple:35000,priceDoble:45000,img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=300&q=80'},
{id:'h2',name:'Cheeseburger Clásica',desc:'Carne artesanal 160g, doble queso mozzarella, tomate, lechuga fresca y mayonesa casera.',priceSimple:28000,priceDoble:38000,img:'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=300&q=80'},
{id:'h3',name:'Bacon Lover',desc:'Carne 160g, extra bacon ahumado, queso cheddar, pepinillos y salsa barbacoa.',priceSimple:34000,priceDoble:44000,img:'https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=300&q=80'},
{id:'h4',name:'Chicken Crispy',desc:'Pechuga de pollo empanada ultra crocante, queso crema, lechuga y salsa tártara.',priceSimple:30000,priceDoble:40000,img:'https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=300&q=80'}]},
{category:'combos',catName:'🍟 Combos Imperdibles',items:[
{id:'c1',name:'Combo Supreme + Papas + Coca',desc:'Hamburguelândia Supreme + Porción de papas fritas medianas + Gaseosa 500ml.',priceSimple:48000,priceDoble:58000,img:'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f6?auto=format&fit=crop&w=300&q=80'},
{id:'c2',name:'Combo Dupla Feliz',desc:'2 Cheeseburgers Clásicas + Papas Fritas Grandes + Gaseosa 1.5L.',priceSimple:75000,priceDoble:95000,img:'https://images.unsplash.com/photo-1610614819513-58e34989848b?auto=format&fit=crop&w=300&q=80'}]},
{category:'bebidas',catName:'🥤 Bebidas',items:[
{id:'b1',name:'Coca Cola 500ml',desc:'Bien helada.',priceSimple:8000,priceDoble:8000,img:'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80'},
{id:'b2',name:'Jugo Natural de Naranja',desc:'500ml exprimido en el momento.',priceSimple:12000,priceDoble:12000,img:'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80'}]}
];

let cart=[],selectedItem=null,selectedSize='Simple';

function renderMenu(filterCat='all',searchKeyword=''){
 const container=document.getElementById('menuContent');container.innerHTML='';
 menuData.forEach(cat=>{
  if(filterCat!=='all'&&cat.category!==filterCat)return;
  const filteredItems=cat.items.filter(i=>i.name.toLowerCase().includes(searchKeyword.toLowerCase())||i.desc.toLowerCase().includes(searchKeyword.toLowerCase()));
  if(!filteredItems.length)return;
  let html=`<div class="section-header">${cat.catName}</div>`;
  filteredItems.forEach(item=>html+=`<div class="item-card"><img src="${item.img}" class="item-img" alt="${item.name}"><div class="item-details"><div><div class="item-name">${item.name}</div><div class="item-desc">${item.desc}</div></div><div class="item-bottom"><div class="item-price">Desde ${item.priceSimple.toLocaleString()} Gs</div><button class="add-btn" onclick="openItemModal('${item.id}')"><i class="fas fa-plus"></i> Pedir</button></div></div></div>`);
  container.innerHTML+=html;
 });
}
function filterCategory(cat,el){document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderMenu(cat,document.getElementById('searchInput').value)}
function filterMenu(){const a=document.querySelector('.cat-chip.active');const cat=a?a.getAttribute('onclick').split("'")[1]:'all';renderMenu(cat,document.getElementById('searchInput').value)}
function openItemModal(itemId){
 menuData.forEach(cat=>{const found=cat.items.find(i=>i.id===itemId);if(found)selectedItem=found});
 if(!selectedItem)return;
 document.getElementById('modalItemTitle').innerText=selectedItem.name;
 document.getElementById('modalItemDesc').innerText=selectedItem.desc;
 let sizeHtml=`<label class="radio-option"><span>Simple (1 Carne)</span><div style="display:flex;align-items:center;gap:8px"><b>${selectedItem.priceSimple.toLocaleString()} Gs</b><input type="radio" name="itemSize" value="Simple" checked onchange="selectedSize='Simple'"></div></label>`;
 if(selectedItem.priceDoble&&selectedItem.priceDoble!==selectedItem.priceSimple)sizeHtml+=`<label class="radio-option"><span>Doble (2 Carnes)</span><div style="display:flex;align-items:center;gap:8px"><b>${selectedItem.priceDoble.toLocaleString()} Gs</b><input type="radio" name="itemSize" value="Doble" onchange="selectedSize='Doble'"></div></label>`;
 document.getElementById('modalSizeOptions').innerHTML=sizeHtml;
 document.getElementById('modalExtrasOptions').innerHTML=`<label class="radio-option"><span>Extra Queso Cheddar (+5.000 Gs)</span><input type="checkbox" id="extraCheddar"></label><label class="radio-option"><span>Extra Bacon (+6.000 Gs)</span><input type="checkbox" id="extraBacon"></label>`;
 selectedSize='Simple';document.getElementById('itemModal').style.display='flex';
}
function closeItemModal(){document.getElementById('itemModal').style.display='none'}
function confirmAddToCart(){
 let basePrice=selectedSize==='Doble'?selectedItem.priceDoble:selectedItem.priceSimple,extras=[];
 if(document.getElementById('extraCheddar').checked){basePrice+=5000;extras.push('Extra Cheddar')}
 if(document.getElementById('extraBacon').checked){basePrice+=6000;extras.push('Extra Bacon')}
 const title=`${selectedItem.name} (${selectedSize})${extras.length?' + '+extras.join(', '):''}`;
 const target=mozoOpen?mozoCart:cart;const existing=target.find(c=>c.title===title);existing?existing.qty++:target.push({title,price:basePrice,qty:1});
 closeItemModal();mozoOpen?renderMozo():updateCartUI();
}
function updateCartUI(){
 const totalQty=cart.reduce((s,i)=>s+i.qty,0),totalPrice=cart.reduce((s,i)=>s+i.price*i.qty,0);
 document.getElementById('cartBadge').innerText=totalQty;document.getElementById('cartTotalFloat').innerText=totalPrice.toLocaleString()+' Gs';document.getElementById('cartTotalModal').innerText=totalPrice.toLocaleString()+' Gs';
 const c=document.getElementById('cartItemsList');
 c.innerHTML=cart.length?cart.map((item,idx)=>`<div class="cart-item-row"><div><div style="font-weight:700;font-size:13px">${item.title}</div><div style="color:var(--primary-yellow);font-size:12px">${(item.price*item.qty).toLocaleString()} Gs</div></div><div style="display:flex;align-items:center;gap:8px"><button class="qty-btn" onclick="changeQty(${idx},-1)">-</button><span style="font-weight:bold;font-size:13px">${item.qty}</span><button class="qty-btn" onclick="changeQty(${idx},1)">+</button></div></div>`).join(''):'<p style="text-align:center;color:#888;padding:20px">Tu carrito está vacío</p>';
}
function changeQty(idx,delta){cart[idx].qty+=delta;if(cart[idx].qty<=0)cart.splice(idx,1);updateCartUI()}
function openCartModal(){document.getElementById('cartModal').style.display='flex'}
function closeCartModal(){document.getElementById('cartModal').style.display='none'}
function toggleChangeBox(){document.getElementById('custChange').style.display=document.getElementById('custPayment').value==='Efectivo'?'block':'none'}
function sendWhatsAppOrder(){
 if(!cart.length){alert('Agrega al menos un producto.');return}
 const name=document.getElementById('custName').value.trim(),address=document.getElementById('custAddress').value.trim(),payment=document.getElementById('custPayment').value,change=document.getElementById('custChange').value.trim(),notes=document.getElementById('custNotes').value.trim();
 if(!name||!address){alert('Por favor completa tu Nombre y Dirección.');return}
 const totalPrice=cart.reduce((s,i)=>s+i.price*i.qty,0);
 let msg=`🍔 *NUEVO PEDIDO - HAMBURGUELÂNDIA CDE* 🍔\n------------------------------------\n👤 *Cliente:* ${name}\n📍 *Dirección:* ${address}\n------------------------------------\n📋 *RESUMEN DEL PEDIDO:*\n\n`;
 cart.forEach(item=>msg+=`▪️ ${item.qty}x ${item.title} = *${(item.price*item.qty).toLocaleString()} Gs*\n`);
 msg+=`\n💰 *TOTAL:* *${totalPrice.toLocaleString()} Gs*\n------------------------------------\n💳 *Forma de Pago:* ${payment}\n`;
 if(payment==='Efectivo'&&change)msg+=`💵 *Cambio para:* ${change}\n`;
 if(notes)msg+=`📝 *Notas:* ${notes}\n`;
 msg+=`------------------------------------\n¡Muchas gracias! Quedo atento a la confirmación.`;
 const order=addOrder({type:'delivery',name,address,payment,change,notes,items:cart.map(i=>({title:i.title,price:i.price,qty:i.qty})),total:totalPrice});
 myOrderId=order.id;try{localStorage.setItem('hcde_my',order.id)}catch(e){}
 window.open(`https://wa.me/5950982194749?text=${encodeURIComponent(msg)}`,'_blank');
 cart=[];updateCartUI();closeCartModal();refreshAll();openTrack();
}
/* ===== PEDIDOS: panel, mozo, seguimiento e impresión =====
   Los pedidos se guardan en el navegador (localStorage), por lo que panel, mozo y cliente
   comparten datos solo en el MISMO dispositivo/navegador. Para varios dispositivos
   hace falta un servidor: basta reemplazar el objeto DB por llamadas a una API. */
const ST_NAMES=['En análisis','En producción','Listo para entrega','Entregado'];
const ST_COLORS=['#f59e0b','#e50914','#25d366','#666'];
const NEXT_LABEL=['Aceptar y producir','Marcar listo','Marcar entregado'];
const MESAS=12;
let lastSnap='',myOrderId=0,mozoMesa=null,mozoCart=[],mozoNotesVal='',mozoOpen=false,panelOpen=false;
try{myOrderId=+localStorage.getItem('hcde_my')||0}catch(e){}
const DB={
 get(){try{return JSON.parse(localStorage.getItem('hcde_orders')||'[]')}catch(e){return []}},
 set(o){try{localStorage.setItem('hcde_orders',JSON.stringify(o))}catch(e){}lastSnap=''},
 nextId(){let n=100;try{n=(+localStorage.getItem('hcde_seq')||100)+1;localStorage.setItem('hcde_seq',n)}catch(e){n=Date.now()%100000}return n}
};
const fmt=n=>n.toLocaleString()+' Gs';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function addOrder(o){const all=DB.get();o.id=DB.nextId();o.status=0;o.closed=false;o.at=Date.now();all.push(o);DB.set(all);return o}
function setStatus(id,s){const all=DB.get();const o=all.find(x=>x.id===id);if(o){o.status=s;DB.set(all)}}
function advance(id){const o=DB.get().find(x=>x.id===id);if(o&&o.status<3){setStatus(id,o.status+1);refreshAll()}}

/* --- Seguimiento del cliente --- */
function openTrack(){document.getElementById('trackModal').style.display='flex';renderTrack()}
function closeTrack(){document.getElementById('trackModal').style.display='none'}
function renderTrack(){
 const o=DB.get().find(x=>x.id===myOrderId),box=document.getElementById('trackBody');
 if(!o){box.innerHTML='<p style="text-align:center;color:#888;padding:20px">Todavía no hiciste ningún pedido.</p>';return}
 const steps=['Pedido recibido','En preparación','Listo para entrega','Entregado'];
 box.innerHTML=`<div style="font-weight:700">Pedido #${o.id} · ${fmt(o.total)}</div><div style="font-size:12px;color:var(--text-secondary);margin:4px 0 8px">${o.items.map(i=>i.qty+'x '+esc(i.title)).join('<br>')}</div>`+
  steps.map((t,k)=>`<div class="tstep ${k<=o.status?'done':''}"><i>${k<=o.status?'<i class="fas fa-check" style="border:0;width:auto;height:auto;font-size:11px"></i>':''}</i><span>${t}</span></div>`).join('')+
  '<p style="font-size:11px;color:#777;margin-top:8px">El estado se actualiza solo cuando el local avanza tu pedido.</p>';
}
function updateChip(){
 const o=DB.get().find(x=>x.id===myOrderId),c=document.getElementById('trackChip');
 if(o&&o.status<3){c.style.display='block';c.innerHTML=`<i class="fas fa-receipt"></i> Pedido #${o.id} · ${ST_NAMES[o.status]}`}else c.style.display='none';
}

/* --- Panel de pedidos --- */
function orderCard(o){
 const donde=o.type==='mesa'?`<b>Mesa ${o.mesa}</b>`:`<b>Delivery</b> · ${esc(o.name)}`;
 return `<div class="ocard"><div class="ohead"><b>#${o.id}</b> ${donde}<span>${hora(o.at)}</span></div>
 <div class="oitems">${o.items.map(i=>i.qty+'x '+esc(i.title)).join('<br>')}</div>
 ${o.type==='delivery'?`<div class="ometa">📍 ${esc(o.address)}<br>💳 ${esc(o.payment)}${o.change?' · cambio '+esc(o.change):''}</div>`:''}
 ${o.notes?`<div class="ometa">📝 ${esc(o.notes)}</div>`:''}
 <div class="ototal">${fmt(o.total)}</div>
 <div class="oact"><button class="obtn" onclick="advance(${o.id})">${NEXT_LABEL[o.status]}</button><button class="obtn alt" onclick="printTicket(${o.id})" aria-label="Imprimir comanda"><i class="fas fa-print"></i></button></div></div>`;
}
function renderPanel(){
 const all=DB.get().filter(o=>o.status<3);
 document.getElementById('panelBody').innerHTML=[0,1,2].map(s=>{const l=all.filter(o=>o.status===s);
  return `<div class="pcol"><div class="pcol-h" style="background:${ST_COLORS[s]}">${ST_NAMES[s]} (${l.length})</div>${l.length?l.map(orderCard).join(''):'<p class="pempty">Sin pedidos.</p>'}</div>`}).join('');
}

/* --- Impresión de comanda --- */
function printTicket(id){
 const o=DB.get().find(x=>x.id===id);if(!o)return;
 const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);
 const d=f.contentWindow.document;d.open();
 d.write(`<html><head><title>Comanda #${o.id}</title><style>@page{margin:0}body{font:12px/1.35 monospace;width:72mm;margin:0;padding:4mm}h1{font-size:15px;text-align:center;margin:0 0 4px}hr{border:0;border-top:1px dashed #000}.r{display:flex;justify-content:space-between;gap:8px}</style></head><body>
 <h1>HAMBURGUELÂNDIA CDE</h1><hr>
 <div><b>COMANDA #${o.id}</b><br>${o.type==='mesa'?'MESA '+o.mesa:'DELIVERY'}<br>${new Date(o.at).toLocaleString()}</div><hr>
 ${o.items.map(i=>`<div class="r"><span>${i.qty}x ${esc(i.title)}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}<hr>
 <div class="r"><b>TOTAL</b><b>${fmt(o.total)}</b></div>
 ${o.type==='delivery'?`<hr>Cliente: ${esc(o.name)}<br>Dir: ${esc(o.address)}<br>Pago: ${esc(o.payment)}${o.change?'<br>Cambio: '+esc(o.change):''}`:''}
 ${o.notes?`<hr>Obs: ${esc(o.notes)}`:''}
 </body></html>`);d.close();
 setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),2000)},300);
}

/* --- Mozo: mesas y comandas --- */
const mesaOrders=n=>DB.get().filter(o=>o.type==='mesa'&&o.mesa===n&&!o.closed);
function selectMesa(n){mozoMesa=n;mozoCart=[];mozoNotesVal='';renderMozo()}
function backMesas(){mozoMesa=null;mozoCart=[];renderMozo()}
function mozoQty(k,d){mozoCart[k].qty+=d;if(mozoCart[k].qty<=0)mozoCart.splice(k,1);renderMozo()}
function sendToKitchen(){
 if(!mozoCart.length)return;
 addOrder({type:'mesa',mesa:mozoMesa,notes:mozoNotesVal.trim(),items:mozoCart.map(i=>({title:i.title,price:i.price,qty:i.qty})),total:mozoCart.reduce((s,i)=>s+i.price*i.qty,0)});
 mozoCart=[];mozoNotesVal='';refreshAll();
}
function closeMesa(){
 const pay=document.getElementById('mozoPay').value,all=DB.get();
 all.forEach(o=>{if(o.type==='mesa'&&o.mesa===mozoMesa&&!o.closed){o.closed=true;o.paid=pay}});
 DB.set(all);mozoMesa=null;mozoCart=[];refreshAll();
}
function renderMozo(){
 const b=document.getElementById('mozoBody');
 if(mozoMesa===null){
  b.innerHTML='<div class="option-title" style="margin-top:0">Elige una mesa</div><div class="mgrid">'+Array.from({length:MESAS},(_,i)=>{const n=i+1,os=mesaOrders(n),t=os.reduce((s,o)=>s+o.total,0);
   return `<button class="mesa ${os.length?'busy':''}" onclick="selectMesa(${n})"><b>${n}</b><small>${os.length?fmt(t):'Libre'}</small></button>`}).join('')+'</div>';
  return;
 }
 const os=mesaOrders(mozoMesa),tot=os.reduce((s,o)=>s+o.total,0),pend=mozoCart.reduce((s,i)=>s+i.price*i.qty,0);
 const items=menuData.flatMap(c=>c.items);
 b.innerHTML=`<button class="obtn alt" onclick="backMesas()"><i class="fas fa-arrow-left"></i> Mesas</button><h3 style="margin:12px 0 0">Mesa ${mozoMesa}</h3>
 <div class="option-title">Ya enviado a cocina</div>
 ${os.length?os.map(o=>`<div class="cart-item-row"><div style="font-size:12px"><b>#${o.id}</b> · <span style="color:${ST_COLORS[o.status]}">${ST_NAMES[o.status]}</span><br>${o.items.map(i=>i.qty+'x '+esc(i.title)).join('<br>')}</div><b style="font-size:12px">${fmt(o.total)}</b></div>`).join(''):'<p class="pempty">Nada todavía.</p>'}
 <div class="option-title">Nueva comanda</div>
 ${mozoCart.length?mozoCart.map((i,k)=>`<div class="cart-item-row"><div><div style="font-weight:700;font-size:13px">${esc(i.title)}</div><div style="color:var(--primary-yellow);font-size:12px">${fmt(i.price*i.qty)}</div></div><div style="display:flex;align-items:center;gap:8px"><button class="qty-btn" onclick="mozoQty(${k},-1)">-</button><span style="font-weight:bold;font-size:13px">${i.qty}</span><button class="qty-btn" onclick="mozoQty(${k},1)">+</button></div></div>`).join(''):'<p class="pempty">Agrega productos de la lista.</p>'}
 <div class="mozo-menu">${items.map(i=>`<div class="cart-item-row"><span style="font-size:13px">${esc(i.name)}</span><button class="add-btn" onclick="openItemModal('${i.id}')"><i class="fas fa-plus"></i> Agregar</button></div>`).join('')}</div>
 <input type="text" id="mozoNotes" class="form-input" placeholder="Observaciones (Ej: sin cebolla)" value="${esc(mozoNotesVal)}" oninput="mozoNotesVal=this.value">
 <button class="btn-green" style="background:var(--primary);margin-top:0" onclick="sendToKitchen()" ${mozoCart.length?'':'disabled'}><i class="fas fa-paper-plane"></i> Enviar a cocina · ${fmt(pend)}</button>
 ${os.length?`<div class="option-title">Cerrar cuenta · Total ${fmt(tot)}</div><select id="mozoPay" class="form-input"><option>Efectivo</option><option>Transferencia Bancaria</option><option>POS / Tarjeta</option><option>PIX</option></select><button class="btn-green" style="margin-top:0" onclick="closeMesa()"><i class="fas fa-check"></i> Cerrar cuenta de la mesa</button>`:''}`;
}

/* --- Navegación y sincronización --- */
function route(){
 const h=location.hash;
 panelOpen=h==='#panel';mozoOpen=h==='#mozo';
 document.getElementById('panelView').style.display=panelOpen?'block':'none';
 document.getElementById('mozoView').style.display=mozoOpen?'block':'none';
 document.body.style.overflow=(panelOpen||mozoOpen)?'hidden':'';
 if(panelOpen)renderPanel();
 if(mozoOpen){mozoMesa=null;mozoCart=[];renderMozo()}
}
function refreshAll(){
 const snap=localStorage.getItem('hcde_orders')||'';
 if(snap===lastSnap)return;lastSnap=snap;
 updateChip();
 if(document.getElementById('trackModal').style.display==='flex')renderTrack();
 if(panelOpen)renderPanel();
 if(mozoOpen)renderMozo();
}
window.addEventListener('hashchange',route);
window.addEventListener('storage',refreshAll);
setInterval(refreshAll,3000);

toggleChangeBox();renderMenu();updateChip();route();
</script>
</body>
</html>
