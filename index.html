<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburguelândia CDE - Web App Delivery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#e50914;--primary-yellow:#ffb703;--bg-main:#0d0d0d;--card-bg:#181818;--card-border:#282828;--text-primary:#fff;--text-secondary:#a0a0a0;--accent-green:#25d366;--border-radius:16px}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:var(--bg-main);color:var(--text-primary);padding-bottom:110px}
        .hero-header{position:relative;background:linear-gradient(to bottom,rgba(0,0,0,.3),var(--bg-main)),url('https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;padding:40px 20px 20px;text-align:center;border-bottom:1px solid var(--card-border)}
        .logo-ring{width:100px;height:100px;margin:0 auto 12px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 20px rgba(229,9,20,.6);display:flex;align-items:center;justify-content:center}
        .logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
        .restaurant-title{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
        .restaurant-slogan{font-size:13px;color:var(--primary-yellow);font-weight:500;margin-top:2px}
        .social-bar{display:flex;justify-content:center;gap:12px;margin-top:15px}
        .social-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px;transition:.2s;backdrop-filter:blur(5px)}
        .social-icon:hover{transform:translateY(-2px);background:var(--primary)}
        .search-container{padding:15px 20px;position:sticky;top:0;z-index:90;background:rgba(13,13,13,.95);backdrop-filter:blur(10px)}
        .search-box{background:#222;border-radius:12px;padding:10px 15px;display:flex;align-items:center;gap:10px;border:1px solid #333}
        .search-box input{background:transparent;border:none;color:#fff;width:100%;font-size:14px;outline:none}
        .categories-scroll{display:flex;gap:10px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
        .categories-scroll::-webkit-scrollbar{display:none}
        .cat-chip{padding:8px 16px;background:#222;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text-secondary);border:1px solid #333;cursor:pointer;transition:.2s}
        .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .app-container{max-width:500px;margin:0 auto;padding:0 15px}
        .section-header{font-size:18px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:8px;color:var(--primary-yellow)}
        .item-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--border-radius);padding:14px;margin-bottom:14px;display:flex;gap:12px;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2)}
        .item-img{width:95px;height:95px;border-radius:12px;object-fit:cover;flex-shrink:0}
        .item-details{flex:1;display:flex;flex-direction:column;justify-content:space-between}
        .item-name{font-size:15px;font-weight:700;line-height:1.2;margin-bottom:4px}
        .item-desc{font-size:11px;color:var(--text-secondary);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
        .item-bottom{display:flex;justify-content:space-between;align-items:center}
        .item-price{font-weight:700;font-size:15px;color:var(--primary-yellow)}
        .add-btn{background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;transition:.15s}
        .add-btn:active{transform:scale(.92)}
        .cart-float-bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:calc(100% - 30px);max-width:470px;background:var(--primary);color:#fff;padding:14px 20px;border-radius:30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 25px rgba(229,9,20,.5);z-index:1000;cursor:pointer}
        .cart-info{display:flex;align-items:center;gap:10px}
        .cart-count-badge{background:#fff;color:var(--primary);font-weight:800;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);z-index:2000;display:none;justify-content:center;align-items:flex-end}
        .modal-sheet{background:#181818;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow-y:auto;position:relative;animation:slideUp .3s ease-out}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .sheet-close{position:absolute;top:15px;right:15px;background:#282828;border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
        .option-title{font-size:13px;font-weight:700;color:var(--primary-yellow);margin:15px 0 8px;text-transform:uppercase}
        .radio-option{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#222;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
        .radio-option input{accent-color:var(--primary)}
        .form-input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-size:13px;margin-bottom:10px;outline:none}
        .form-input:focus{border-color:var(--primary)}
        .cart-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #282828}
        .qty-btn{background:#282828;color:#fff;border:none;width:28px;height:28px;border-radius:6px;font-weight:bold;cursor:pointer}
        .btn-green{width:100%;background:var(--accent-green);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:15px}
        .btn-green:disabled{opacity:.5;cursor:not-allowed}
        .fullview{position:fixed;inset:0;background:var(--bg-main);z-index:1500;display:none;overflow-y:auto}
        .fv-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;border-bottom:1px solid var(--card-border);z-index:2;font-size:16px}
        .fv-body{max-width:500px;margin:0 auto;padding:16px}
        .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
        @media(max-width:800px){.pgrid{grid-template-columns:1fr}}
        .pcol{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:10px;align-self:start}
        .pcol-h{color:#fff;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
        .pempty{color:#888;font-size:13px;padding:6px}
        .ocard{background:#222;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px}
        .ohead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
        .ohead span{margin-left:auto;color:#a0a0a0;font-size:12px}
        .oitems{line-height:1.5}
        .ometa{color:#a0a0a0;font-size:12px;margin-top:6px}
        .ototal{color:var(--primary-yellow);font-weight:800;margin:8px 0}
        .oact{display:flex;gap:8px}
        .obtn{flex:1;background:var(--primary);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
        .obtn.alt{flex:0 0 auto;background:#333;padding:10px 14px}
        .track-chip{position:fixed;right:15px;bottom:84px;z-index:1000;background:#fff;color:#111;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;display:none}
        .tstep{display:flex;align-items:center;gap:12px;padding:12px 0;color:#777}
        .tstep i{width:26px;height:26px;border-radius:50%;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal;flex-shrink:0}
        .tstep.done{color:#fff}
        .tstep.done i{background:var(--accent-green);border-color:var(--accent-green)}
        .mz-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(17,17,17,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--card-border)}
        .mz-bar .ttl{flex:1;min-width:0}
        .mz-bar .ttl b{display:block;font-size:16px;line-height:1.2}
        .mz-bar .ttl small{color:var(--text-secondary);font-size:12px}
        .mz-ic{width:40px;height:40px;border-radius:12px;border:1px solid #333;background:#1c1c1c;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .mz-wrap{max-width:720px;margin:0 auto;padding:16px 16px 170px}
        .mz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
        .mz-stat{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:12px}
        .mz-stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
        .mz-stat small{color:var(--text-secondary);font-size:11px}
        .mz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
        @media(min-width:560px){.mz-grid{grid-template-columns:repeat(3,1fr)}}
        .mz-card{text-align:left;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:14px 14px 14px 18px;color:#fff;cursor:pointer;position:relative;overflow:hidden;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .12s}
        .mz-card:active{transform:scale(.97)}
        .mz-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#2f2f2f}
        .mz-card.busy::before{background:var(--primary)}
        .mz-card.ready::before{background:var(--accent-green)}
        .mz-card .n{font-size:28px;font-weight:800;line-height:1}
        .mz-card .n small{display:block;font-size:11px;color:var(--text-secondary);font-weight:600;margin-bottom:3px}
        .mz-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:#262626;color:#aaa;white-space:nowrap}
        .mz-badge.busy{background:rgba(229,9,20,.16);color:#ff6068}
        .mz-badge.ready{background:rgba(37,211,102,.16);color:#25d366}
        .mz-badge.wait{background:rgba(245,158,11,.16);color:#f59e0b}
        .mz-total{font-weight:800;font-size:16px;color:var(--primary-yellow)}
        .mz-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
        .mz-sec{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--primary-yellow)}
        .mz-order{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:12px;margin-bottom:10px}
        .mz-order .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
        .mz-order ul{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.6;color:#ddd}
        .mz-order .f{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed #333;font-size:12px;color:var(--text-secondary)}
        .mz-pend{background:rgba(229,9,20,.07);border:1px solid rgba(229,9,20,.35);border-radius:14px;padding:4px 12px;margin-bottom:12px}
        .mz-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
        .mz-tabs::-webkit-scrollbar{display:none}
        .mz-tab{padding:8px 16px;background:#222;border:1px solid #333;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text-secondary);cursor:pointer}
        .mz-tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
        .mz-search{display:flex;align-items:center;gap:10px;background:#222;border:1px solid #333;border-radius:12px;padding:0 14px;margin-bottom:12px}
        .mz-search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px;padding:12px 0}
        .mz-prod{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:10px;margin-bottom:8px}
        .mz-prod img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0}
        .mz-prod .t{flex:1;min-width:0}
        .mz-prod .t b{display:block;font-size:14px;line-height:1.25}
        .mz-prod .t small{color:var(--primary-yellow);font-weight:700;font-size:12px}
        .mz-add{width:40px;height:40px;border-radius:12px;border:0;background:var(--primary);color:#fff;cursor:pointer;font-size:14px;flex-shrink:0}
        .mz-add:active{transform:scale(.92)}
        .mz-dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(17,17,17,.97);backdrop-filter:blur(8px);border-top:1px solid var(--card-border)}
        .mz-dock .in{max-width:720px;margin:0 auto}
        .mz-dock input{width:100%;padding:11px 12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-size:13px;margin-bottom:8px;outline:none}
        .mz-send{width:100%;border:0;border-radius:14px;padding:15px 18px;background:var(--primary);color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .mz-send:disabled{background:#2a2a2a;color:#777;cursor:not-allowed}
        .mz-bill{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:14px;margin-top:22px}
        .mz-bill .tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;color:var(--text-secondary);font-size:13px}
        .mz-bill .tot b{font-size:26px;color:var(--primary-yellow)}
        .mz-pay{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
        .mz-pay button{padding:12px 8px;border-radius:12px;border:1px solid #333;background:#1c1c1c;color:#ccc;font-weight:600;font-size:13px;cursor:pointer}
        .mz-pay button.on{border-color:var(--primary);background:rgba(229,9,20,.14);color:#fff}
        .mz-close{width:100%;border:0;border-radius:14px;padding:14px;background:var(--accent-green);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
        .ad-wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
        .ad-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 0;max-width:1100px;margin:0 auto}
        .ad-tabs::-webkit-scrollbar{display:none}
        .ad-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
        .ad-kpi{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:14px}
        .ad-kpi small{display:block;color:var(--text-secondary);font-size:12px;margin-bottom:4px}
        .ad-kpi b{font-size:20px;font-weight:800}
        .ad-flow{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
        .ad-step{flex:1;min-width:112px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:12px;border-top:4px solid #444}
        .ad-step b{display:block;font-size:26px;font-weight:800;line-height:1.1}
        .ad-step small{color:var(--text-secondary);font-size:12px}
        .ad-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:14px;margin-bottom:12px}
        .ad-card h4{margin:0 0 10px;font-size:14px;color:var(--primary-yellow)}
        .ad-grid2{display:grid;grid-template-columns:1fr;gap:12px}
        @media(min-width:800px){.ad-grid2{grid-template-columns:1fr 1fr}}
        .ad-li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #262626;font-size:13px}
        .ad-li:last-child{border:0}
        .ad-li span:last-child{color:#ddd;text-align:right;white-space:nowrap}
        .ad-bars{display:flex;align-items:flex-end;gap:3px;height:150px}
        .ad-bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
        .ad-bar .c{flex:1;width:100%;display:flex;align-items:flex-end}
        .ad-bar i{display:block;width:100%;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px}
        .ad-bar span{font-size:9px;color:#888;margin-top:4px}
        .ad-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
        .ad-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
        .ad-nav b{flex:1;text-align:center;font-size:14px;text-transform:capitalize}
        .ad-l{display:block;font-size:12px;color:var(--text-secondary);margin:10px 0 4px}
        .obtn.rej{background:#3a1215;color:#ff6068}
    </style>
</head>
<body>
<header class="hero-header">
    <div class="logo-ring"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=200&q=80" alt="Hamburguelândia Logo"></div>
    <h1 class="restaurant-title">Hamburguelândia CDE</h1>
    <p class="restaurant-slogan">Sabores que te hacen sonreír 🍔✨</p>
    <div class="social-bar">
        <a href="https://wa.me/5950982194749" class="social-icon" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://instagram.com/hamburguelandia_cde" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://maps.google.com" class="social-icon" target="_blank"><i class="fas fa-location-dot"></i></a>
        <a href="https://tiktok.com" class="social-icon" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://facebook.com" class="social-icon" target="_blank"><i class="fab fa-facebook-f"></i></a>
    </div>
</header>

<div class="search-container">
    <div class="search-box"><i class="fas fa-search" style="color:#666"></i><input type="text" id="searchInput" placeholder="Buscar hamburguesa, combos, bebidas..." oninput="filterMenu()"></div>
</div>

<div class="categories-scroll">
    <div class="cat-chip active" onclick="filterCategory('all',this)">🔥 Todos</div>
    <div class="cat-chip" onclick="filterCategory('artesanales',this)">🍔 Artesanales</div>
    <div class="cat-chip" onclick="filterCategory('combos',this)">🍟 Combos</div>
    <div class="cat-chip" onclick="filterCategory('bebidas',this)">🥤 Bebidas</div>
    <div class="cat-chip" onclick="filterCategory('postres',this)">🍦 Postres</div>
</div>

<div class="app-container"><div id="menuContent"></div></div>

<div class="cart-float-bar" onclick="openCartModal()">
    <div class="cart-info"><div class="cart-count-badge" id="cartBadge">0</div><span style="font-weight:700">Ver Pedido</span></div>
    <span id="cartTotalFloat" style="font-weight:800;font-size:16px">0 Gs</span>
</div>

<div class="modal-overlay" id="itemModal">
    <div class="modal-sheet">
        <button class="sheet-close" onclick="closeItemModal()">&times;</button>
        <h3 id="modalItemTitle" style="font-size:18px;margin-bottom:4px"></h3>
        <p id="modalItemDesc" style="font-size:12px;color:var(--text-secondary);margin-bottom:12px"></p>
        <div class="option-title">1. Elige el Tamaño</div><div id="modalSizeOptions"></div>
        <div class="option-title">2. Extras opcionales</div><div id="modalExtrasOptions"></div>
        <button class="btn-green" style="background:var(--primary);margin-top:20px" onclick="confirmAddToCart()"><i class="fas fa-cart-plus"></i> Agregar al Pedido</button>
    </div>
</div>

<div class="modal-overlay" id="cartModal">
    <div class="modal-sheet">
        <button class="sheet-close" onclick="closeCartModal()">&times;</button>
        <h3 style="font-size:18px;margin-bottom:15px"><i class="fas fa-shopping-bag" style="color:var(--primary)"></i> Mi Pedido</h3>
        <div id="cartItemsList"></div>
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:15px 0;border-top:1px dashed #333;padding-top:10px"><span>Total:</span><span id="cartTotalModal" style="color:var(--primary-yellow)">0 Gs</span></div>
        <div class="option-title">Datos para la entrega</div>
        <input type="text" id="custName" class="form-input" placeholder="Tu Nombre completo *">
        <input type="text" id="custAddress" class="form-input" placeholder="Dirección de entrega o Barrio *">
        <div class="option-title">Forma de Pago</div>
        <select id="custPayment" class="form-input" onchange="toggleChangeBox()">
            <option value="Efectivo">Efectivo</option><option value="Transferencia Bancaria">Transferencia Bancaria</option><option value="POS / Tarjeta">POS / Tarjeta</option><option value="PIX">PIX</option>
        </select>
        <input type="text" id="custChange" class="form-input" placeholder="¿Cambio de cuánto necesitas? (Ej: 100.000 Gs)">
        <input type="text" id="custNotes" class="form-input" placeholder="Observaciones (Ej: Sin cebolla, pan bien tostado)">
        <button class="btn-green" onclick="sendWhatsAppOrder()"><i class="fab fa-whatsapp" style="font-size:20px"></i> Enviar Pedido al WhatsApp</button>
    </div>
</div>

/* ===== PEDIDOS: panel, mozo, seguimiento e impresión =====
   Los pedidos se guardan en el navegador (localStorage), por lo que panel, mozo y cliente
   comparten datos solo en el MISMO dispositivo/navegador. Para varios dispositivos

const ST_NAMES=['En análisis','En producción','Listo para entrega','Entregado','Rechazado'];

try{myOrderId=+localStorage.getItem('hcde_my')||0}catch(e){}
const DB={
 get(){try{return JSON.parse(localStorage.getItem('hcde_orders')||'[]')}catch(e){return []}},
 set(o){try{localStorage.setItem('hcde_orders',JSON.stringify(o))}catch(e){}lastSnap=''},
 nextId(){let n=100;try{n=(+localStorage.getItem('hcde_seq')||100)+1;localStorage.setItem('hcde_seq',n)}catch(e){n=Date.now()%100000}return n}
};

function advance(id){const o=DB.get().find(x=>x.id===id);if(o&&o.status<3){setStatus(id,o.status+1);refreshAll()}}

  steps.map((t,k)=>`<div class="tstep ${k<=o.status?'done':''}"><i>${k<=o.status?'<i class="fas fa-check" style="border:0;width:auto;height:auto;font-size:11px"></i>':''}</i><span>${t}</span></div>`).join('')+

 ${o.items.map(i=>`<div class="r"><span>${i.qty}x ${esc(i.title)}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}<hr>

 ${o.notes?`<hr>Obs: ${esc(o.notes)}`:''}

/* estadísticas y periodos */
function rangeOf(mode,off){
 const n=new Date();let a,b;
 if(mode==='day'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)}
 else if(mode==='week'){const dow=(n.getDay()+6)%7;a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+off*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7)}
 else{a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(n.getFullYear(),n.getMonth()+off+1,1)}
 return [a.getTime(),b.getTime()];
}
function rangeLabel(mode,a,b){
 const f=t=>new Date(t).toLocaleDateString('es-PY',{day:'2-digit',month:'short'});
 if(mode==='day')return new Date(a).toLocaleDateString('es-PY',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 if(mode==='week')return f(a)+' – '+f(b-43200000);
 return new Date(a).toLocaleDateString('es-PY',{month:'long',year:'numeric'});
}
function stats(a,b){
 const os=DB.get().filter(o=>o.at>=a&&o.at<b),sales=os.filter(sale),total=sales.reduce((s,o)=>s+o.total,0);
 const add=(m,k,v)=>{(m[k]=m[k]||{n:0,v:0});m[k].n++;m[k].v+=v};
 const byChannel={Delivery:{n:0,v:0},Mesa:{n:0,v:0}},byPay={},byWaiter={},prod={};
 sales.forEach(o=>{
  add(byChannel,o.type==='mesa'?'Mesa':'Delivery',o.total);
  add(byPay,o.type==='mesa'?(o.paid||'Cuenta abierta'):(o.payment||'—'),o.total);
  if(o.type==='mesa')add(byWaiter,o.waiter||'Sin nombre',o.total);
  o.items.forEach(i=>{const k=i.title.replace(/\s\((Simple|Doble)\).*$/,'');(prod[k]=prod[k]||{q:0,v:0});prod[k].q+=i.qty;prod[k].v+=i.qty*i.price});
 });
 const rd=sales.filter(o=>o.ts&&o.ts[2]).map(o=>o.ts[2]-o.at);
 return {os,sales,total,count:sales.length,avg:sales.length?total/sales.length:0,rej:os.filter(o=>o.status===4),byChannel,byPay,byWaiter,prod,avgReady:rd.length?rd.reduce((x,y)=>x+y,0)/rd.length:0};
}
function series(mode,a,b,sales){
 if(mode==='day'){
  const h=Array(24).fill(0);sales.forEach(o=>{h[new Date(o.at).getHours()]+=o.total});
  let lo=h.findIndex(x=>x>0),hi=23-[...h].reverse().findIndex(x=>x>0);if(lo<0){lo=10;hi=22}
  return h.slice(lo,hi+1).map((v,i)=>({l:String(lo+i),v}));
 }
 const days=Math.round((b-a)/86400000),arr=[];
 for(let i=0;i<days;i++)arr.push({l:mode==='week'?['L','M','X','J','V','S','D'][i]:String(i+1),v:0});
 sales.forEach(o=>{const i=Math.round((new Date(o.at).setHours(0,0,0,0)-a)/86400000);if(arr[i])arr[i].v+=o.total});
 return arr;
}
function bars(arr){
 const mx=Math.max(1,...arr.map(x=>x.v));
 return `<div class="ad-bars">${arr.map(x=>`<div class="ad-bar" title="${esc(x.l)}: ${fmt(x.v)}"><div class="c"><i style="height:${Math.round(x.v/mx*100)}%"></i></div><span>${x.l}</span></div>`).join('')}</div>`;
}
const objList=o=>{const e=Object.entries(o).sort((x,y)=>y[1].v-x[1].v);return e.length?e.map(([k,v])=>li(esc(k),v.n+' pedidos · '+fmt(v.v))).join(''):'<p class="pempty">Sin datos.</p>'};
const topList=(p,n)=>{const e=Object.entries(p).sort((x,y)=>y[1].q-x[1].q).slice(0,n);return e.length?e.map(([k,v])=>li(esc(k),v.q+' u · '+fmt(v.v))).join(''):'<p class="pempty">Sin datos.</p>'};

function admMesaDetail(){
 const m=mesaInfo(admMesa),list=m.os.concat(m.rej);
 return `<div class="ad-row"><button class="obtn alt" onclick="admMesa=null;renderAdmin()"><i class="fas fa-arrow-left"></i> Mesas</button><b>Mesa ${admMesa}${m.waiter?' · '+esc(m.waiter):''}</b></div>`+
 (list.length?list.map(o=>`<div class="mz-order"><div class="h"><b>#${o.id} · ${hora(o.at)}</b><span class="mz-badge" style="background:${ST_COLORS[o.status]}2b;color:${ST_COLORS[o.status]}">${ST_NAMES[o.status]}</span></div><ul>${o.items.map(i=>`<li>${i.qty}x ${esc(i.title)}</li>`).join('')}</ul>${o.notes?`<div class="f"><span>📝 ${esc(o.notes)}</span></div>`:''}${o.status===4?`<div class="f"><span>Rechazado: ${esc(o.reason||'')}</span></div>`:`<div class="f"><span>Subtotal</span><b style="color:#fff">${fmt(o.total)}</b></div><div class="oact" style="margin-top:8px">${admActs(o)}</div>`}</div>`).join(''):'<p class="pempty">Mesa libre, sin pedidos.</p>')+
 (m.os.length?consumoHtml(m.os,m.tot)+`<div class="mz-bill" style="margin-top:12px"><div class="mz-pay">${MZ_PAYS.map(p=>`<button class="${p===admPayVal?'on':''}" onclick="admPayVal='${p}';renderAdmin()">${p}</button>`).join('')}</div><button class="obtn alt" style="width:100%;margin-bottom:8px;padding:12px" onclick="printBill(${admMesa})"><i class="fas fa-print"></i> Imprimir cuenta</button><button class="mz-close" onclick="admCloseMesa()"><i class="fas fa-check"></i> Cerrar cuenta</button></div>`:'');
}
function admMenu(){
 return `<div class="ad-row"><b>Menú del local</b><button class="obtn" style="flex:0 0 auto" onclick="editItem('')"><i class="fas fa-plus"></i> Nuevo producto</button></div>`+
 menuData.map(c=>`<div class="mz-sec">${esc(c.catName)}</div>`+c.items.map(i=>`<div class="mz-prod"><img src="${esc(i.img)}" alt="" loading="lazy"><div class="t"><b>${esc(i.name)}</b><small>${fmt(i.priceSimple)}${i.priceDoble&&i.priceDoble!==i.priceSimple?' · Doble '+fmt(i.priceDoble):''}</small><div style="font-size:11px;color:#888;margin-top:2px;max-height:30px;overflow:hidden">${esc(i.desc)}</div></div><button class="mz-ic" onclick="editItem('${i.id}')" aria-label="Editar ${esc(i.name)}"><i class="fas fa-pen"></i></button></div>`).join('')).join('');
}
function repSet(m){repMode=m;repOff=0;renderAdmin()}
function repGo(d){if(repOff+d>0)return;repOff+=d;renderAdmin()}
function admReport(){
 const [a,b]=rangeOf(repMode,repOff),s=stats(a,b);
 return `<div class="mz-tabs" style="margin-top:0">${[['day','Día'],['week','Semana'],['month','Mes']].map(m=>`<button class="mz-tab ${m[0]===repMode?'on':''}" onclick="repSet('${m[0]}')">${m[1]}</button>`).join('')}</div>
 <div class="ad-nav"><button class="mz-ic" onclick="repGo(-1)" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button><b>${rangeLabel(repMode,a,b)}</b><button class="mz-ic" onclick="repGo(1)" ${repOff>=0?'disabled style="opacity:.35"':''} aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button></div>
 <div class="ad-kpis">${kpi('Ventas',fmt(s.total),'var(--primary-yellow)')}${kpi('Pedidos',s.count)}${kpi('Ticket promedio',fmt(Math.round(s.avg)))}${kpi('Rechazados',s.rej.length,s.rej.length?ST_COLORS[4]:'')}</div>
 <div class="ad-card"><h4>${repMode==='day'?'Ventas por hora':'Ventas por día'}</h4>${bars(series(repMode,a,b,s.sales))}</div>
 <div class="ad-grid2"><div class="ad-card"><h4>Por canal</h4>${objList(s.byChannel)}</div><div class="ad-card"><h4>Por forma de pago</h4>${objList(s.byPay)}</div></div>
 <div class="ad-grid2"><div class="ad-card"><h4>Por mozo</h4>${objList(s.byWaiter)}</div><div class="ad-card"><h4>Productos más vendidos</h4>${topList(s.prod,10)}</div></div>`;
}
function admGo(t){admTab=t;admMesa=null;renderAdmin();document.getElementById('adminView').scrollTop=0}
function renderAdmin(){
 const pend=DB.get().filter(o=>o.status===0).length;
 const tabs=[['dash','Dashboard'],['ped','Pedidos'+(pend?' ('+pend+')':'')],['com','Comandas'],['menu','Menú'],['rep','Reportes']];
 const body={dash:admDash,ped:admPed,com:admCom,menu:admMenu,rep:admReport}[admTab]();
 document.getElementById('adminBody').innerHTML=`<div class="mz-bar"><div class="mz-ic" style="background:var(--primary);border-color:var(--primary)"><i class="fas fa-user-shield"></i></div><div class="ttl"><b>Administración</b><small>Hamburguelândia CDE</small></div><button class="mz-ic" onclick="location.hash=''" aria-label="Salir"><i class="fas fa-right-from-bracket"></i></button></div>
 <div class="ad-tabs">${tabs.map(t=>`<button class="mz-tab ${t[0]===admTab?'on':''}" onclick="admGo('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="ad-wrap">${body}</div>`;
}

/* --- Navegación y sincronización --- */
function route(){
 const h=location.hash;
 panelOpen=h==='#panel';mozoOpen=h==='#mozo';admOpen=h==='#admin';
 document.getElementById('panelView').style.display=panelOpen?'block':'none';
 document.getElementById('mozoView').style.display=mozoOpen?'block':'none';
 document.getElementById('adminView').style.display=admOpen?'block':'none';
 document.body.style.overflow=(panelOpen||mozoOpen||admOpen)?'hidden':'';
 if(panelOpen)renderPanel();
 if(mozoOpen){mozoMesa=null;mozoCart=[];renderMozo()}
 if(admOpen){admMesa=null;renderAdmin()}
}
function refreshAll(){
 const snap=localStorage.getItem('hcde_orders')||'';
 if(snap===lastSnap)return;lastSnap=snap;
 updateChip();
 if(document.getElementById('trackModal').style.display==='flex')renderTrack();
 if(panelOpen)renderPanel();
 if(mozoOpen)renderMozo();
 if(admOpen)renderAdmin();
}
window.addEventListener('hashchange',route);
window.addEventListener('storage',refreshAll);
setInterval(refreshAll,3000);

toggleChangeBox();renderMenu();updateChip();route();
</script>
</body>
</html>
